schemaVersion: 2.3.0
metadata:
  name: workshop-dotnet-keda-autoscaling
  version: 1.0.0
  description: Event-Driven Autoscaling with KEDA - .NET
attributes:
  che-editor: vscode
components:
  - name: tools
    container:
      image: image-registry.openshift-image-registry.svc:5000/workspace-images/udi-rhel9:latest
      env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka-kafka-bootstrap:9092
        - name: KAFKA_TOPIC
          value: keda-events
        - name: DOTNET_CLI_TELEMETRY_OPTOUT
          value: "1"
        - name: DOTNET_NOLOGO
          value: "1"
      volumeMounts:
        - name: nuget
          path: /home/user/.nuget
      cpuLimit: '2'
      cpuRequest: '500m'
      memoryLimit: '3Gi'
      memoryRequest: '1Gi'
      mountSources: true
  - name: nuget
    volume:
      size: 1G

commands:
  - id: produce
    exec:
      label: "1. Produce Messages (builds Kafka lag)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "dotnet run --project src/EventProducer -- 3000"
      group:
        kind: run
        isDefault: false

  - id: deploy
    exec:
      label: "2. Deploy Consumer (1 pod, no autoscaling)"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "oc apply -f manifests/deployment.yaml -f manifests/service.yaml -f manifests/route.yaml && oc scale deployment/workshop-dotnet-keda-autoscaling --replicas=1"
      group:
        kind: run
        isDefault: false

  - id: apply-scaledobject
    exec:
      label: "3. Apply ScaledObject"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "oc apply -f manifests/scaledobject.yaml"
      group:
        kind: run
        isDefault: true
